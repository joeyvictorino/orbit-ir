[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-agent-incident-lab"
version = "0.2.0"
description = "Reproducible synthetic agent-incident reconstruction and evidence reconciliation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Joey Victorino"}]
keywords = ["digital-forensics", "incident-response", "ai-agents", "evidence-reconciliation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
orbit-ir = "orbit_ir.cli:main"

[tool.setuptools.packages.find]
include = ["orbit_ir*"]
