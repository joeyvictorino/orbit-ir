name: SARIF upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    name: Analyze and upload SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install orbit-ir
        run: python -m pip install .

      - name: Run full synthetic exercise
        run: orbit-ir demo --workdir work

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.28.0
        with:
          sarif_file: work/results/findings.sarif
          category: orbit-ir
        if: always()
